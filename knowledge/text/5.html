<h3>Важкі бомбери</h3>

<p>
  Квадрокоптери — це безпілотні літальні апарати (БпЛА) з чотирма 
  електродвигунами, призначені для виконання широкого спектра завдань із 
  повітря. Вони поєднують сучасні системи навігації, стабілізації та високоточні 
  камери, що забезпечує ефективну роботу в різних бойових умовах.
</p>
